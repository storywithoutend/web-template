name: Cleanup Stale Tunnels

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 6am UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need all branches for comparison

      - name: Compute repo name
        id: repo
        run: |
          REPO_NAME=$(basename -s .git "$(git remote get-url origin)")
          echo "name=$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: Cleanup orphaned tunnels and DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          CF_API="https://api.cloudflare.com/client/v4"
          REPO_NAME="${{ steps.repo.outputs.name }}"

          # Get all tunnels matching our naming pattern for localhost stage
          TUNNELS=$(curl -sf \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel?is_deleted=false&name_prefix=${REPO_NAME}-" \
            | jq -r '.result[] | select(.name | endswith("-localhost")) | "\(.id) \(.name)"')

          if [ -z "$TUNNELS" ]; then
            echo "No localhost tunnels found."
            exit 0
          fi

          # Get all branch hashes from current remote branches
          BRANCH_HASHES=""
          while IFS= read -r branch; do
            branch_name="${branch#origin/}"
            hash=$(printf '%s' "$branch_name" | sha256sum | cut -c1-8)
            BRANCH_HASHES="$BRANCH_HASHES $hash"
          done < <(git branch -r --format='%(refname:short)' | grep -v HEAD)

          echo "Active branch hashes: $BRANCH_HASHES"

          # Check each tunnel
          while IFS=' ' read -r tunnel_id tunnel_name; do
            # Extract hash from tunnel name: {repo}-{hash}-localhost
            tunnel_hash=$(echo "$tunnel_name" | sed "s/^${REPO_NAME}-//" | sed 's/-localhost$//')

            if echo "$BRANCH_HASHES" | grep -qw "$tunnel_hash"; then
              echo "KEEP: $tunnel_name (branch still exists)"
            else
              echo "DELETE: $tunnel_name (branch no longer exists)"

              # Delete associated DNS records
              WEB_HOST="${REPO_NAME}-${tunnel_hash}.localhost.yolotime.dev"
              AUTH_HOST="auth.${REPO_NAME}-${tunnel_hash}.localhost.yolotime.dev"

              for hostname in "$WEB_HOST" "$AUTH_HOST"; do
                record_id=$(curl -sf \
                  -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                  "$CF_API/zones/$CLOUDFLARE_ZONE_ID/dns_records?type=CNAME&name=$hostname" \
                  | jq -r '.result[0].id // empty')

                if [ -n "$record_id" ]; then
                  curl -sf -X DELETE \
                    -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                    "$CF_API/zones/$CLOUDFLARE_ZONE_ID/dns_records/$record_id" > /dev/null
                  echo "  Deleted DNS: $hostname"
                fi
              done

              # Clean connections then delete tunnel
              curl -sf -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$tunnel_id/connections" > /dev/null 2>&1 || true

              curl -sf -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$tunnel_id" > /dev/null
              echo "  Deleted tunnel: $tunnel_id"
            fi
          done <<< "$TUNNELS"

          echo "Cleanup complete."
